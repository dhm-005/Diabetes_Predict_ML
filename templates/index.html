<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Quan trọng để responsive trên mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Diabetes Prediction</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        input:focus {
            outline: none;
            border-color: #555;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        .info{
            display: grid;
            grid-template-columns: 2fr 2fr;
            column-gap: 30px;
        }

        /* Mobile */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 20px;
                border-radius: 8px;
            }

            h1 {
                font-size: 24px;
            }

            input,
            button {
                font-size: 16px;
            }
            .info{
                display: flex;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Diabetes Prediction</h1>

        <form method="POST" action="{{ url_for('predict') }}">
            <div class="info">
            <div class="form-group">
                <label for="Pregnancies">Pregnancies</label>
                <input type="number" 
                    id="Pregnancies" name="Pregnancies"
                    value="{{ form_data['Pregnancies'] if form_data else 0 }}" min="0"
                    required
                >
            </div>

            <div class="form-group">
                <label for="Glucose">Glucose</label>
                <input type="number"
                    id="Glucose" name="Glucose"
                    value="{{ form_data['Glucose'] if form_data else 100 }}" min="0"
                    required
                >
            </div>
            <div class="form-group">
                <label for="BloodPressure">Blood Pressure</label>
                <input type="number"
                    id="BloodPressure" name="BloodPressure"
                    value="{{ form_data['BloodPressure'] if form_data else 65 }}" min="0"
                    required
                >
            </div>
            <div class="form-group">
                <label for="SkinThickness">Skin Thickness</label>
                <input type="number"
                    id="SkinThickness" name="SkinThickness"
                    value="{{ form_data['SkinThickness'] if form_data else 0 }}" min="0"
                    required
                >
            </div>
            <div class="form-group">
                <label for="Insulin">Insulin</label>
                <input type="number"
                    id="Insulin" name="Insulin"
                    value="{{ form_data['Insulin'] if form_data else 0 }}" min="0"
                    required
                >
            </div>
            <div class="form-group">
                <label for="BMI">BMI</label>
                <input type="number"
                    id="BMI" name="BMI"
                    value="{{ form_data['BMI'] if form_data else 35 }}"
                    step="0.1" min="0"
                    required
                >
            </div>
            <div class="form-group">
                <label for="DiabetesPedigreeFunction">
                    Diabetes Pedigree Function
                </label>

                <input type="number"
                    id="DiabetesPedigreeFunction" name="DiabetesPedigreeFunction"
                    value="{{ form_data['DiabetesPedigreeFunction'] if form_data else 0.3 }}"
                    step="0.01" min="0"
                    required
                >
            </div>
            <div class="form-group">
                <label for="Age">Age</label>

                <input type="number"
                    id="Age" name="Age"
                    value="{{ form_data['Age'] if form_data else 22 }}" min="0"
                    required
                >
            </div>
            </div>
            <button type="submit">
                Predict
            </button>

        </form>

    </div>

</body>

</html>
